name: sdo-semantic-observability

services:
  sdo-observability:
    build: .
    image: sdo-semantic-observability:local
    ports:
      - "4100:4100"
    environment:
      PORT: "4100"
      SDO_PUBLIC_BASE_URL: "http://localhost:4100"
      SDO_FIELD_USAGE_MIN_PARTICIPANTS: "2"
      STORAGE_TYPE: "postgres"
      DATABASE_URL: "postgres://sdo:sdo@postgres:5432/sdo_semantic_observability"
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sdo
      POSTGRES_PASSWORD: sdo
      POSTGRES_DB: sdo_semantic_observability
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdo -d sdo_semantic_observability"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
